<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema en mantenimiento</title>
<style>
  :root {
    --c1: #0f172a;
    --c2: #1e3a8a;
    --acento: #38bdf8;
    --acento2: #a78bfa;
    --texto: #e2e8f0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: var(--texto);
    background: linear-gradient(-45deg, #0f172a, #1e3a8a, #312e81, #0c4a6e);
    background-size: 400% 400%;
    animation: fondo 15s ease infinite;
    overflow: hidden;
  }
  @keyframes fondo {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Partículas flotando */
  .particula {
    position: fixed;
    bottom: -20px;
    border-radius: 50%;
    background: rgba(255,255,255,.15);
    animation: subir linear infinite;
  }
  @keyframes subir {
    to { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }

  .tarjeta {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 50px 40px;
    max-width: 520px;
    width: 90%;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 24px;
    backdrop-filter: blur(12px);
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
    animation: aparecer 1s ease-out;
  }
  @keyframes aparecer {
    from { opacity: 0; transform: translateY(30px) scale(.96); }
    to   { opacity: 1; transform: none; }
  }

  /* Logo */
  .logo {
    display: block;
    max-width: 180px;
    max-height: 90px;
    margin: 0 auto 25px;
    filter: drop-shadow(0 4px 14px rgba(0,0,0,.4));
    animation: flotar 3.5s ease-in-out infinite;
  }
  @keyframes flotar {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }

  /* Engranajes */
  .engranajes {
    position: relative;
    width: 160px;
    height: 120px;
    margin: 0 auto 25px;
  }
  .engranaje {
    position: absolute;
    fill: var(--acento);
    filter: drop-shadow(0 0 10px rgba(56,189,248,.6));
  }
  .g1 { width: 90px; left: 10px; top: 15px; animation: girar 4s linear infinite; }
  .g2 { width: 60px; left: 92px; top: 0;    fill: var(--acento2); animation: girarInv 2.7s linear infinite; filter: drop-shadow(0 0 10px rgba(167,139,250,.6)); }
  .g3 { width: 45px; left: 98px; top: 62px; animation: girarInv 2s linear infinite; opacity: .85; }
  @keyframes girar    { to { transform: rotate(360deg); } }
  @keyframes girarInv { to { transform: rotate(-360deg); } }

  h1 {
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    font-weight: 700;
    margin-bottom: 12px;
    background: linear-gradient(90deg, var(--acento), var(--acento2), var(--acento));
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: brillo 4s linear infinite;
  }
  @keyframes brillo { to { background-position: 200% center; } }

  .mensaje {
    font-size: 1.05rem;
    line-height: 1.6;
    opacity: .85;
    min-height: 3.4em;
    transition: opacity .5s;
  }

  /* Barra de progreso */
  .barra {
    margin: 28px auto 10px;
    height: 8px;
    width: 100%;
    background: rgba(255,255,255,.1);
    border-radius: 10px;
    overflow: hidden;
  }
  .barra span {
    display: block;
    height: 100%;
    width: 40%;
    border-radius: 10px;
    background: linear-gradient(90deg, var(--acento), var(--acento2));
    animation: cargar 2.2s ease-in-out infinite;
  }
  @keyframes cargar {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(260%); }
  }

  .estado {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    font-size: .9rem;
    opacity: .75;
  }
  .punto {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #facc15;
    animation: latido 1.4s ease-in-out infinite;
  }
  @keyframes latido {
    0%, 100% { box-shadow: 0 0 0 0 rgba(250,204,21,.7); }
    50%      { box-shadow: 0 0 0 8px rgba(250,204,21,0); }
  }

  footer {
    margin-top: 26px;
    font-size: .8rem;
    opacity: .5;
  }
</style>
</head>
<body>

  <div class="tarjeta">
    <!-- Logo DIMAYOR desde Google Drive (el archivo debe estar compartido como "Cualquier persona con el enlace") -->
    <img class="logo"
         src="https://lh3.googleusercontent.com/d/1l4mdgdoIJxuPBRY8VDhhC-AJQW6vgdWr"
         alt="DIMAYOR"
         referrerpolicy="no-referrer"
         onerror="if(!this.dataset.r){this.dataset.r=1;this.src='https://drive.google.com/thumbnail?id=1l4mdgdoIJxuPBRY8VDhhC-AJQW6vgdWr&sz=w600';}else{this.style.display='none';}">

    <div class="engranajes">
      <svg class="engranaje g1" viewBox="0 0 100 100"><path d="M43 5h14l2 11a35 35 0 0 1 9 4l9-7 10 10-7 9a35 35 0 0 1 4 9l11 2v14l-11 2a35 35 0 0 1-4 9l7 9-10 10-9-7a35 35 0 0 1-9 4l-2 11H43l-2-11a35 35 0 0 1-9-4l-9 7-10-10 7-9a35 35 0 0 1-4-9L5 57V43l11-2a35 35 0 0 1 4-9l-7-9 10-10 9 7a35 35 0 0 1 9-4zM50 35a15 15 0 1 0 0 30 15 15 0 0 0 0-30z"/></svg>
      <svg class="engranaje g2" viewBox="0 0 100 100"><path d="M43 5h14l2 11a35 35 0 0 1 9 4l9-7 10 10-7 9a35 35 0 0 1 4 9l11 2v14l-11 2a35 35 0 0 1-4 9l7 9-10 10-9-7a35 35 0 0 1-9 4l-2 11H43l-2-11a35 35 0 0 1-9-4l-9 7-10-10 7-9a35 35 0 0 1-4-9L5 57V43l11-2a35 35 0 0 1 4-9l-7-9 10-10 9 7a35 35 0 0 1 9-4zM50 35a15 15 0 1 0 0 30 15 15 0 0 0 0-30z"/></svg>
      <svg class="engranaje g3" viewBox="0 0 100 100"><path d="M43 5h14l2 11a35 35 0 0 1 9 4l9-7 10 10-7 9a35 35 0 0 1 4 9l11 2v14l-11 2a35 35 0 0 1-4 9l7 9-10 10-9-7a35 35 0 0 1-9 4l-2 11H43l-2-11a35 35 0 0 1-9-4l-9 7-10-10 7-9a35 35 0 0 1-4-9L5 57V43l11-2a35 35 0 0 1 4-9l-7-9 10-10 9 7a35 35 0 0 1 9-4zM50 35a15 15 0 1 0 0 30 15 15 0 0 0 0-30z"/></svg>
    </div>

    <h1>Sistema en mantenimiento</h1>
    <p class="mensaje" id="mensaje">Estamos realizando una programación de mejoras para brindarte una mejor experiencia.</p>

    <div class="barra"><span></span></div>

    <div class="estado"><span class="punto"></span> Trabajando en las mejoras…</div>

    <footer>Gracias por tu paciencia · Volvemos pronto</footer>
  </div>

<script>
  // Mensajes que rotan
  const mensajes = [
    "Estamos realizando una programación de mejoras para brindarte una mejor experiencia.",
    "Optimizando el rendimiento del sistema…",
    "Aplicando actualizaciones de seguridad…",
    "Ajustando los últimos detalles. ¡Ya casi terminamos!"
  ];
  let i = 0;
  const el = document.getElementById("mensaje");
  setInterval(() => {
    el.style.opacity = 0;
    setTimeout(() => {
      i = (i + 1) % mensajes.length;
      el.textContent = mensajes[i];
      el.style.opacity = .85;
    }, 500);
  }, 4000);

  // Partículas de fondo
  for (let n = 0; n < 25; n++) {
    const p = document.createElement("div");
    p.className = "particula";
    const t = Math.random() * 10 + 4;
    p.style.width = p.style.height = t + "px";
    p.style.left = Math.random() * 100 + "vw";
    p.style.animationDuration = (Math.random() * 10 + 8) + "s";
    p.style.animationDelay = (Math.random() * 10) + "s";
    document.body.appendChild(p);
  }
</script>
</body>
</html>
